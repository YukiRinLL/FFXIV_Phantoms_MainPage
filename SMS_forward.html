<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display All Data from SMS_forward Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
    <!-- 全局配置（必须在其他脚本之前加载） -->
    <script src="./assets/js/config.js"></script>
</head>
<body>

<h2>SMS_forward Table Data</h2>

<table id="dataTable">
    <thead>
    <tr>
        <th>ID</th>
        <th>Created At</th>
        <th>SMS</th>
    </tr>
    </thead>
    <tbody>
    <!-- Data will be loaded here -->
    </tbody>
</table>

<script>
    // 从全局配置获取（如果未加载则使用回退值）
    const apiURL = ((window.APP_CONFIG && window.APP_CONFIG.SUPABASE_URL) || 'https://dshmbsawwrbuycnivcjs.supabase.co') + '/rest/v1/sms_forward?select=*';
    const anonPubKey = (window.APP_CONFIG && window.APP_CONFIG.ANON_KEY) || '';

    // Function to fetch data from the API
    function fetchData() {
        fetch(apiURL, {
            method: 'GET',
            headers: {
                'apikey': anonPubKey,
                'Authorization': `Bearer ${anonPubKey}`,
                'Content-Type': 'application/json'
            }
        })
            .then(response => response.json())
            .then(data => {
                // Handle data
                const tableBody = document.getElementById('dataTable').querySelector('tbody');
                tableBody.innerHTML = ''; // Clear existing data

                data.forEach(row => {
                    const rowHtml = `
        <tr>
          <td>${row.id}</td>
          <td>${row.created_at}</td>
          <td>${row.message}</td>
        </tr>
      `;
                    tableBody.innerHTML += rowHtml;
                });
            })
            .catch(error => {
                console.error('Error fetching data:', error);
            });
    }

    // Call fetchData on page load
    fetchData();
</script>

</body>
</html>
