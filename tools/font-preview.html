<!DOCTYPE html>

            border: 1px solid #55555a;
            border-radius: 8px;
            background: #111113;
            color: #fff;
            font: 18px/1.5 Arial, sans-serif;
        }
        .special-panel {

            font-weight: normal;

            background: #303034;
            color: #eee;

            white-space: nowrap;

            .special-download { margin-left: auto; }
        }

</head>

<main>
    <div class="page-heading">
        <div>
            <h1 data-i18n="title">FFXIV Font Preview</h1>
            <p class="intro" data-i18n="intro">输入英文文段，预览不同艾欧泽亚字体，并将喜欢的样式导出为 PNG。</p>

        <section class="font-tools-section">

        <div class="mixed-toolbar">

            <button id="downloadMixed" type="button" data-i18n="downloadMixed">Download Mixed PNG</button>
        </div>
        <div id="mixedEditor" class="mixed-editor" contenteditable="true" spellcheck="false">The adventure begins beyond the horizon.</div>
        <details class="special-panel" open>
            <summary data-i18n="mixedSpecial">Special characters for mixed editor</summary>
            <div id="mixedSpecialCharacters" class="special-grid"></div>
        </details>
    </section>
</main>

    };
    const specialLabels = {
        e020: ['全宽平假名', 'Full-width Hiragana', '全角ひらがな'], e021: ['全宽片假名', 'Full-width Katakana', '全角カタカナ'], e022: ['英文输入法', 'English IME', '英語入力'], e023: ['半宽片假名', 'Half-width Katakana', '半角カタカナ'], e031: ['任务时钟', 'Quest timer', 'クエスト時計'], e033: ['物品品级', 'Item level', 'アイテムレベル'], e048: ['水晶栏', 'Crystal inventory', 'クリスタル'], e049: ['金币', 'Gil', 'ギル'], e03c: ['优质道具', 'High quality', '高品質'], e03d: ['收藏品', 'Collectable', 'コレクション'], e042: ['攻击标记', 'Attack marker', '攻撃マーカー'], e043: ['禁止标记', 'Prohibited marker', '禁止マーカー'], e048: ['水晶栏', 'Crystal inventory', 'クリスタル'], e06a: ['等级', 'Level', 'レベル'], e0bb: ['链接', 'Link', 'リンク'], e0d2: ['艾欧泽亚时间', 'Eorzea time', 'エオルゼア時間']
    };
    const fontDescriptions = {
        'Hingashi Extended': { zh: '输入拉丁字母时显示普通艾欧泽亚字符；数字/部分汉字/日语平假名和片假名会显示为东方风格字符。[作者 Florin Dupontel on Mateus]', en: 'Latin letters use the regular Eorzean style; numbers, selected Chinese characters, Hiragana and Katakana use the Eastern style. [Author: Florin Dupontel on Mateus]', ja: 'ラテン文字は通常のエオルゼア風、数字・一部の漢字・ひらがな・カタカナは東洋風で表示されます。[作者: Florin Dupontel on Mateus]' },
        'Eorzea': { zh: '艾欧泽亚字体 [作者 Myranda]', en: 'Eorzea Font [Author: Myranda]', ja: 'エオルゼアフォント [作者: Myranda]' },
        'Eorzean Replica': { zh: '艾欧泽亚字体复刻版', en: 'Eorzean font replica', ja: 'エオルゼア風フォント レプリカ' },
        'First World': { zh: '第一世界风格字体', en: 'First World style font', ja: '第一世界風フォント' },
        'Jupiter': { zh: '任务英语名称字体', en: 'Quest title font', ja: 'クエスト名フォント' },
        'Jupiter Bold': { zh: '任务英语名称加粗字体', en: 'Bold quest title font', ja: '太字クエスト名フォント' },
        'Eurostar Chat': { zh: '游戏内聊天栏字体', en: 'In-game chat font', ja: 'ゲーム内チャットフォント' },
        'Axis UI': { zh: '游戏内主要字体', en: 'Main in-game UI font', ja: 'ゲーム内メイン UI フォント' }
    };
    let currentLanguage = localStorage.getItem('ffxiv-font-language') || 'zh';
    const textInput = document.getElementById('fontText');
    const specialInput = document.getElementById('specialText');
    const previews = document.getElementById('previews');
    const fontTexts = fonts.map(() => textInput.value);

    function t(key) { return translations[currentLanguage][key] || translations.en[key] || key; }

    function applyLanguage() {
        document.documentElement.lang = currentLanguage === 'zh' ? 'zh-CN' : currentLanguage === 'ja' ? 'ja' : 'en';
        document.querySelectorAll('[data-i18n]').forEach(element => { element.textContent = t(element.dataset.i18n); });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(element => { element.placeholder = t(element.dataset.i18nPlaceholder); });
        document.getElementById('languageSelect').value = currentLanguage;
        renderSpecialCharacters();
        renderMixedSpecialCharacters();
        render();
    }

    function insertSpecialCharacter(code) {
        const character = String.fromCodePoint(parseInt(code, 16));
        const start = specialInput.selectionStart;
        const end = specialInput.selectionEnd;
        specialInput.value = specialInput.value.slice(0, start) + character + specialInput.value.slice(end);
        specialInput.focus();
        specialInput.selectionStart = specialInput.selectionEnd = start + character.length;
        specialInput.dispatchEvent(new Event('input'));
    }

    function renderSpecialCharacters() {
        const container = document.getElementById('specialCharacters');
        container.innerHTML = '';
        specialCharacters.forEach(([code, label]) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'special-button';
            button.title = `${label} U+${code.toUpperCase()}`;
            const translatedLabel = specialLabels[code] ? specialLabels[code][currentLanguage === 'zh' ? 0 : currentLanguage === 'ja' ? 2 : 1] : label;
            button.innerHTML = `<span class="special-glyph">&#x${code};</span><span>${translatedLabel}</span><span class="special-code">U+${code.toUpperCase()}</span>`;
            button.addEventListener('click', () => insertSpecialCharacter(code));
            container.appendChild(button);
        });
    }

    function insertIntoMixedEditor(code) {
        const editor = document.getElementById('mixedEditor');
        const character = String.fromCodePoint(parseInt(code, 16));
        editor.focus();
        const selection = window.getSelection();
        const range = selection.rangeCount ? selection.getRangeAt(0) : document.createRange();
        if (!selection.rangeCount || !editor.contains(range.commonAncestorContainer)) {
            range.selectNodeContents(editor);
            range.collapse(false);
        }
        range.deleteContents();
        const specialCharacter = document.createElement('span');
        specialCharacter.style.fontFamily = "'FFXIV'";
        specialCharacter.textContent = character;
        range.insertNode(specialCharacter);
        range.collapse(false);
        selection.removeAllRanges();
        selection.addRange(range);
    }

    function renderMixedSpecialCharacters() {
        const container = document.getElementById('mixedSpecialCharacters');
        container.innerHTML = '';
        specialCharacters.forEach(([code, label]) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'special-button';
            button.title = `${label} U+${code.toUpperCase()}`;
            const translatedLabel = specialLabels[code] ? specialLabels[code][currentLanguage === 'zh' ? 0 : currentLanguage === 'ja' ? 2 : 1] : label;
            button.innerHTML = `<span class="special-glyph">&#x${code};</span><span>${translatedLabel}</span><span class="special-code">U+${code.toUpperCase()}</span>`;
            button.addEventListener('click', () => insertIntoMixedEditor(code));
            container.appendChild(button);
        });
    }

    function applyMixedFont() {
        const editor = document.getElementById('mixedEditor');
        const selection = window.getSelection();
        if (!selection.rangeCount || selection.isCollapsed || !editor.contains(selection.anchorNode)) return;
        const span = document.createElement('span');
        span.style.fontFamily = document.getElementById('mixedFontSelect').value;
        span.appendChild(selection.getRangeAt(0).extractContents());
        selection.getRangeAt(0).insertNode(span);
        selection.removeAllRanges();
        const range = document.createRange();
        range.selectNodeContents(span);
        selection.addRange(range);
    }

    async function downloadMixedPng() {
        const editor = document.getElementById('mixedEditor');
        const canvas = document.createElement('canvas');
        const scale = 2;
        const padding = 48;
        const fontSize = 42;
        const width = Math.max(640, editor.scrollWidth) + padding * 2;
        const height = Math.max(220, editor.scrollHeight) + padding * 2;
        canvas.width = width * scale;
        canvas.height = height * scale;
        const context = canvas.getContext('2d');
        context.scale(scale, scale);
        context.fillStyle = '#f0ece3';
        context.fillRect(0, 0, width, height);
        context.textBaseline = 'top';
        let x = padding;
        let y = padding;
        const draw = node => {
            if (node.nodeType === Node.TEXT_NODE) {
                const text = node.nodeValue || '';
                for (const character of text) {
                    if (character === '\n') { x = padding; y += fontSize * 1.45; continue; }
                    context.fillText(character, x, y);
                    x += context.measureText(character).width;
                }
                return;
            }
            if (node.nodeType !== Node.ELEMENT_NODE) return;
            const previousFont = context.font;
            const family = node.style.fontFamily || 'Arial';
            context.font = `${fontSize}px ${family}`;
            node.childNodes.forEach(draw);
            context.font = previousFont;
        };
        context.fillStyle = '#1c1b1a';
        context.font = `${fontSize}px Arial`;
        editor.childNodes.forEach(draw);
        const link = document.createElement('a');
        link.download = 'ffxiv-mixed-font.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    function initializeTabs() {
        document.querySelectorAll('.tab-button').forEach(button => {
            button.addEventListener('click', () => {
                document.querySelectorAll('.tab-button').forEach(item => {
                    const active = item === button;
                    item.classList.toggle('active', active);
                    item.setAttribute('aria-selected', String(active));
                });
                document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.toggle('active', panel.id === button.dataset.tab));
            });
        });
        const select = document.getElementById('mixedFontSelect');
        fonts.forEach(font => {
            const option = document.createElement('option');
            option.value = `'${font.family}'`;
            option.textContent = font.name;
            select.appendChild(option);
        });
        document.getElementById('applyMixedFont').addEventListener('click', applyMixedFont);
        document.getElementById('downloadMixed').addEventListener('click', downloadMixedPng);
        const languageSelect = document.getElementById('languageSelect');
        languageSelect.addEventListener('change', () => {
            currentLanguage = languageSelect.value;
            localStorage.setItem('ffxiv-font-language', currentLanguage);
            applyLanguage();
        });
    }

    function safeFileName(name) {
        return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'font';
    }

    function render() {
        previews.innerHTML = '';
        fonts.forEach((font, index) => {
            const card = document.createElement('article');
            card.className = 'font-card';
            const hingashiPanel = font.family === 'FF14-Hingashi'
                ? `<details class="mapped-panel" open><summary>${t('chinese')}</summary><div class="mapped-grid hingashi-grid"></div></details>`
                : '';
            const fontDescription = fontDescriptions[font.name][currentLanguage];
            card.innerHTML = `<header><span class="font-name">${font.name}</span><button class="download" type="button" data-index="${index}">${t('downloadPng')}</button></header><p class="font-description">${fontDescription}</p><div class="preview" style="font-family:'${font.family}', sans-serif"></div><textarea class="font-input" spellcheck="false" aria-label="${font.name} text"></textarea><details class="mapped-panel" open><div class="mapped-heading"><summary>${t('mappedCharacters')} (${font.mappedCharacters.length})</summary><input class="mapped-search" type="search" placeholder="${t('filter')}" aria-label="${t('filter')}"></div><div class="mapped-grid"></div></details>${hingashiPanel}`;
            const input = card.querySelector('.font-input');
            const preview = card.querySelector('.preview');
            input.value = fontTexts[index];
            preview.textContent = fontTexts[index] || ' ';
            input.addEventListener('input', () => {
                fontTexts[index] = input.value;
                preview.textContent = input.value || ' ';
            });
            const mappedGrid = card.querySelector('.mapped-grid');
            const mappedSearch = card.querySelector('.mapped-search');
            const createMappedButton = character => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'mapped-button';
                button.innerHTML = `<span class="mapped-glyph" style="font-family:'${font.family}', sans-serif"></span><span>${character === ' ' ? 'space' : character}</span><span class="mapped-code">U+${character.codePointAt(0).toString(16).toUpperCase().padStart(4, '0')}</span>`;
                button.querySelector('.mapped-glyph').textContent = character;
                button.addEventListener('click', () => {
                    const start = input.selectionStart;
                    const end = input.selectionEnd;
                    input.value = input.value.slice(0, start) + character + input.value.slice(end);
                    input.focus();
                    input.selectionStart = input.selectionEnd = start + character.length;
                    input.dispatchEvent(new Event('input'));
                });
                return button;
            };
            const renderMappedCharacters = () => {
                const query = mappedSearch.value.toLowerCase();
                const characters = font.mappedCharacters.filter(character => {
                    const code = character.codePointAt(0).toString(16).padStart(4, '0');
                    return !query || character.toLowerCase().includes(query) || `u+${code}`.includes(query);
                });
                mappedGrid.innerHTML = '';
                const fragment = document.createDocumentFragment();
                characters.forEach(character => fragment.appendChild(createMappedButton(character)));
                mappedGrid.appendChild(fragment);
            };
            mappedSearch.addEventListener('input', renderMappedCharacters);
            renderMappedCharacters();
            if (font.family === 'FF14-Hingashi') {
                const hingashiGrid = card.querySelector('.hingashi-grid');
                hingashiCharacters.forEach(character => hingashiGrid.appendChild(createMappedButton(character)));
                const japanesePanel = document.createElement('details');
                japanesePanel.className = 'mapped-panel';
                japanesePanel.open = true;
                japanesePanel.innerHTML = `<summary>${t('japanese')}</summary><div class="mapped-grid hingashi-japanese-grid"></div>`;
                card.appendChild(japanesePanel);
                const japaneseGrid = japanesePanel.querySelector('.hingashi-japanese-grid');
                hingashiJapaneseCharacters.forEach(character => japaneseGrid.appendChild(createMappedButton(character)));
            }
            card.querySelector('.download').addEventListener('click', () => downloadPng(font));
            previews.appendChild(card);
        });
    }

    async function loadFont(font) {
        const fontPath = font.path || `fonts/${encodeURIComponent(font.file)}`;
        const source = `url("../assets/thewakingsands/${fontPath}")`;
        const loaded = new FontFace(font.family, source);
        await loaded.load();
        document.fonts.add(loaded);
    }

    async function downloadPng(font) {
        const fontIndex = fonts.indexOf(font);
        const button = document.querySelector(`[data-index="${fontIndex}"]`);
        if (button) button.disabled = true;
        try {
            await loadFont(font);
            const scale = 2;
            const padding = 48;
            const fontSize = 48;
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            context.font = `${fontSize}px "${font.family}"`;
            const sourceText = font.family === 'FFXIV' ? specialInput.value : fontTexts[fontIndex];
            const lines = (sourceText || ' ').split('\n');
            const width = Math.max(320, ...lines.map(line => context.measureText(line || ' ').width)) + padding * 2;
            const height = lines.length * fontSize * 1.4 + padding * 2;
            canvas.width = Math.ceil(width * scale);
            canvas.height = Math.ceil(height * scale);
            context.scale(scale, scale);
            context.fillStyle = '#f0ece3';
            context.fillRect(0, 0, width, height);
            context.fillStyle = '#1c1b1a';
            context.font = `${fontSize}px "${font.family}"`;
            context.textBaseline = 'top';
            lines.forEach((line, lineIndex) => context.fillText(line || ' ', padding, padding + lineIndex * fontSize * 1.4));
            const link = document.createElement('a');
            link.download = `ffxiv-${safeFileName(font.name)}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        } finally {
            if (button) button.disabled = false;
        }
    }

    textInput.addEventListener('input', () => {
        fonts.forEach((font, index) => {
            if (fontTexts[index] !== textInput.value) fontTexts[index] = textInput.value;
        });
        render();
    });
    specialInput.addEventListener('input', render);
    document.getElementById('downloadAll').addEventListener('click', async () => {
        for (const font of fonts) await downloadPng(font);
    });
    document.getElementById('downloadSpecial').addEventListener('click', async () => {
        await downloadPng({ name: 'FFXIV Axis Icons', family: 'FFXIV', path: 'axis-font-icons/FFXIV_Lodestone_SSF.ttf' });
    });
    renderSpecialCharacters();
    renderMixedSpecialCharacters();
    initializeTabs();
    applyLanguage();
    render();
</script>
</body>
